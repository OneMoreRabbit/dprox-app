# Example dprox config — production shape, v0.3.0.
# Templated by the platform's Ansible from the registry.
# Schema: see src/dprox/config.py and dprox-design-spec-v0_3.
#
# One dprox answers every org, so there is no top-level `org:` key. A config
# that still carries one fails at startup rather than being ignored.

server:
  bind: "0.0.0.0:8443"
  # REQUIRED. Largest request body dprox will accept, in bytes; over this
  # it answers 413 request_too_large without parsing. There is no default:
  # dprox refuses to start if this key is absent.
  #
  # 65536 is chosen, not inherited: nomic-embed-text reads at most 8192
  # tokens, about 32,000 characters, doubled for JSON escaping and
  # multi-byte text. If the audit log shows real requests near the limit,
  # raise it here.
  max_body_bytes: 65536

# mTLS configuration. Cert files are mounted into the container at
# /etc/dprox/certs/ by Ansible (see cert-provisioning-brief.md).
mtls:
  ca_cert_path: /etc/dprox/certs/ca.crt
  server_cert_path: /etc/dprox/certs/server.crt
  server_key_path: /etc/dprox/certs/server.key
  client_cert_mode: optional         # listener accepts client cert; routes enforce
  tls_min_version: "TLSv1.3"
  tls_pin_enabled: true

# Plan source (read-only). Mounted from /mnt/registry by compose.
plan:
  compiled_plan_path: /mnt/registry/compiled_plan.yml
  cache_enabled: true
  reload_on_mtime_change: true
  reload_on_unknown_cn: true
  reload_min_interval_seconds: 5

# Embedding (must match Ingstr's config exactly — same model, same dim).
embedding:
  endpoint: http://172.16.32.32:11434
  model: nomic-embed-text
  vector_dim: 768
  timeout_seconds: 10
  # REQUIRED, no default. Put in front of every question before it is
  # embedded, and it must match what the collection was indexed with.
  # Nothing can check that it does — a wrong prefix does not fail, it just
  # lowers every score — so it is declared or dprox does not start.
  #
  # An empty string is a real choice, meaning "this model wants no prefix":
  #   nomic-embed-text   "search_query: "   (the trailing space is part of it)
  #   bge-m3             ""
  #   qwen3-embedding    an instruction line, then "Query: " (see below)
  #
  # WRITE IT DOUBLE-QUOTED WITH \n, not as a YAML block scalar. Both parse
  # correctly, but in a block scalar the trailing space after "Query:" sits at
  # the end of a line, where it is invisible and any "strip trailing
  # whitespace on save" setting or pre-commit hook silently deletes it. Inside
  # quotes it is visible and safe. A prefix that loses its last character does
  # not fail — it lowers every score, which is the fault this value exists to
  # prevent.
  #
  # Check what dprox actually holds, rather than what the file looks like:
  # `dprox health` prints it with repr(), and /healthz carries it, so the
  # newline shows as \n and the trailing space is visible before the quote.
  #
  # Changing this changes every score, so change it with the model and the
  # re-index, never on its own.
  query_prefix: "search_query: "

  # The ARC value from 2026-11-23, for qwen3-embedding:4b with vector_dim
  # 2560 (operator's choice, measured by estate-manage; arch hub #16906):
  #
  #   query_prefix: "Instruct: Given a web search query, retrieve relevant\
  #     passages that answer the query\nQuery: "
  #
  # Documents are never prefixed, so ingstr adds nothing.

# Qdrant (read-only access). One server, one collection for each org.
qdrant:
  url: http://qdrant:6333
  api_key_env: QDRANT_RO_API_KEY     # name of env var holding the RO key
  # REQUIRED, at least one entry: org name -> collection name. The org names
  # must be the ones the plan's groups[] section states, or no caller ever
  # resolves to them. Nothing is derived from a name and there is no default.
  # Two orgs may not share a collection: dprox refuses to start, because that
  # would make the org check a no-op and leave only the group filter.
  collections:
    arc: arc_documents
    job: job_documents
  default_limit: 10
  max_limit: 50
  timeout_seconds: 10

logging:
  level: INFO
  format: json
  log_query_text: false              # full query text only at DEBUG
